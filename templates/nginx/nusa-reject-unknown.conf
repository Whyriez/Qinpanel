# Managed by QonPanel: reject unknown website hosts (P10-T6ap).
# Do not proxy unknown hosts to the panel or any tenant website.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
