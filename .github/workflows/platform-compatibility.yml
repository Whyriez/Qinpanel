name: Linux platform compatibility
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    name: Packages and backup (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'almalinux:9', 'almalinux:10']
    env:
      QONPANEL_DISPOSABLE_CI: '1'
    steps:
      - name: Bootstrap container tools
        run: |
          if command -v dnf >/dev/null; then
            # AlmaLinux CI repositories: begin (also used before release checkout).
            for repo in /etc/yum.repos.d/almalinux*.repo; do
              [ -f "$repo" ] || continue
              sed -i -E \
                -e 's|^[[:space:]]*mirrorlist=|#mirrorlist=|' \
                -e 's@^[[:space:]]*#?[[:space:]]*baseurl=https?://((repo|vault)\.almalinux\.org/)@baseurl=https://\1@' "$repo"
            done
            dnf -q clean metadata
            for attempt in 1 2 3; do
              if dnf -y --setopt=retries=2 --setopt=timeout=30 --setopt=skip_if_unavailable=False makecache --refresh; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo '::error::AlmaLinux repository metadata is still unavailable after three attempts.' >&2
                exit 1
              fi
              echo "::warning::AlmaLinux metadata attempt $attempt/3 failed; clearing cache before retry." >&2
              dnf -q clean metadata
              sleep "$((attempt * 5))"
            done
            # AlmaLinux CI repositories: end.
            dnf -y install git tar gzip python3 gcc gcc-c++ make pkgconf-pkg-config
            # Keep the curl provider from the base image (curl or curl-minimal).
            if ! command -v curl >/dev/null; then
              dnf -y install curl-minimal
            fi
          else
            apt-get update -qq
            apt-get install -y --no-install-recommends git curl ca-certificates python3 gcc g++ make pkg-config
          fi
      - uses: actions/checkout@v5
      - name: Check real distribution packages and file layout
        shell: bash
        run: bash scripts/tests/platform-packages-ci.sh
      - name: Install Rust toolchain for native configuration checks
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust sources without cross-distribution build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: platform-native-sources-v1
          key: ${{ matrix.image }}
          cache-targets: 'false'
          cache-bin: 'false'
      - name: Check generated mail configuration with native vendor tools
        shell: bash
        run: cargo test --locked -p panel-agent email::tests::native_email_configuration_syntax -- --ignored --exact
